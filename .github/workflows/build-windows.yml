name: Build Windows Native Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: true

      - name: Show toolchain
        shell: pwsh
        run: |
          nvcc --version
          cmake --version

      - name: Configure Release x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build isothermal Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Detect private non-isothermal build input
        id: noniso
        shell: pwsh
        run: |
          if (Test-Path ".private/noniso/part00") {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Decrypt private non-isothermal CUDA source
        if: steps.noniso.outputs.present == 'true'
        shell: bash
        env:
          NONISO_BUILD_KEY: ${{ secrets.NONISO_BUILD_KEY }}
        run: |
          set -euo pipefail
          test -n "${NONISO_BUILD_KEY:-}"
          mkdir -p .noniso_build
          cat .private/noniso/part* | base64 -d > .noniso_build/noniso_source.enc
          if command -v openssl >/dev/null 2>&1; then
            OPENSSL=openssl
          else
            OPENSSL="/c/Program Files/Git/usr/bin/openssl.exe"
          fi
          "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .noniso_build/noniso_source.enc \
            -out .noniso_build/private_noniso_native.cu.gz \
            -pass env:NONISO_BUILD_KEY
          gzip -dc .noniso_build/private_noniso_native.cu.gz > .noniso_build/private_noniso_native.cu
          python - <<'PY'
          from pathlib import Path
          p = Path('.noniso_build/private_noniso_native.cu')
          s = p.read_text(encoding='utf-8')
          marker = '\nint main(int argc,char**argv)'
          fixed = '} // namespace\n\nint main(int argc,char**argv)'
          if fixed not in s:
              if marker not in s:
                  raise SystemExit('main marker not found in private non-isothermal source')
              s = s.replace(marker, '\n' + fixed, 1)
              p.write_text(s, encoding='utf-8', newline='\n')
          PY
          test -s .noniso_build/private_noniso_native.cu

      - name: Configure non-isothermal native CUDA target
        if: steps.noniso.outputs.present == 'true'
        shell: pwsh
        run: |
          @'
          cmake_minimum_required(VERSION 3.24)
          project(SoilEvaporationLBM_NonIsothermal LANGUAGES CXX CUDA)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CUDA_STANDARD 17)
          set(CMAKE_CUDA_STANDARD_REQUIRED ON)
          find_package(CUDAToolkit REQUIRED)
          string(TIMESTAMP SOIL_LBM_BUILD_UNIX "%s" UTC)
          add_executable(SoilEvaporationLBM_NonIsothermal
            private_noniso_native.cu
            ../src/trial_guard.cpp
          )
          target_include_directories(SoilEvaporationLBM_NonIsothermal PRIVATE ../include)
          target_compile_definitions(SoilEvaporationLBM_NonIsothermal PRIVATE SOIL_LBM_BUILD_UNIX=${SOIL_LBM_BUILD_UNIX})
          target_link_libraries(SoilEvaporationLBM_NonIsothermal PRIVATE CUDA::cudart_static advapi32 crypt32)
          set_property(TARGET SoilEvaporationLBM_NonIsothermal PROPERTY CUDA_RUNTIME_LIBRARY Static)
          set_property(TARGET SoilEvaporationLBM_NonIsothermal PROPERTY CUDA_ARCHITECTURES "75-real;80-real;86-real;89-real;90-real;120-real")
          set_property(TARGET SoilEvaporationLBM_NonIsothermal PROPERTY MSVC_RUNTIME_LIBRARY "MultiThreaded$<$<CONFIG:Debug>:Debug>")
          if(MSVC)
            target_compile_options(SoilEvaporationLBM_NonIsothermal PRIVATE
              $<$<COMPILE_LANGUAGE:CXX>:/O2 /GL /EHsc /utf-8>
              $<$<COMPILE_LANGUAGE:CUDA>:-O3 --use-local-env>
            )
            target_link_options(SoilEvaporationLBM_NonIsothermal PRIVATE
              $<$<CONFIG:Release>:/LTCG /OPT:REF /OPT:ICF>
            )
          endif()
          '@ | Set-Content -Encoding UTF8 .noniso_build\CMakeLists.txt
          cmake -S .noniso_build -B build-noniso -A x64

      - name: Build non-isothermal native CUDA EXE
        if: steps.noniso.outputs.present == 'true'
        shell: pwsh
        run: |
          cmake --build build-noniso --config Release --parallel
          if (!(Test-Path build-noniso\Release\SoilEvaporationLBM_NonIsothermal.exe)) {
            throw "Non-isothermal executable was not produced."
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\SoilEvaporationLBM.exe dist\
          if (Test-Path build-noniso\Release\SoilEvaporationLBM_NonIsothermal.exe) {
            Copy-Item build-noniso\Release\SoilEvaporationLBM_NonIsothermal.exe dist\
          }
          Copy-Item config.txt dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoilEvaporationLBM-native-release-candidate
          path: dist/*
          if-no-files-found: error
