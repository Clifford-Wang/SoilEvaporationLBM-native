name: Build Windows Native Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: false

      - name: Show toolchain
        shell: pwsh
        run: |
          nvcc --version
          cmake --version

      - name: Configure Release x64
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Build isothermal Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Detect private non-isothermal build input
        id: noniso
        shell: pwsh
        run: |
          if (Test-Path ".private/noniso/part00") {
            "present=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "present=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Decrypt private non-isothermal CUDA source
        if: steps.noniso.outputs.present == 'true'
        shell: bash
        env:
          NONISO_BUILD_KEY: ${{ secrets.NONISO_BUILD_KEY }}
        run: |
          set -euo pipefail
          test -n "${NONISO_BUILD_KEY:-}"
          mkdir -p .noniso_build
          cat .private/noniso/part* | base64 -d > .noniso_build/noniso_source.enc
          if command -v openssl >/dev/null 2>&1; then
            OPENSSL=openssl
          else
            OPENSSL="/c/Program Files/Git/usr/bin/openssl.exe"
          fi
          "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .noniso_build/noniso_source.enc \
            -out .noniso_build/private_noniso_native.cu.gz \
            -pass env:NONISO_BUILD_KEY
          gzip -dc .noniso_build/private_noniso_native.cu.gz > .noniso_build/private_noniso_native.cu
          test -s .noniso_build/private_noniso_native.cu

      - name: Build non-isothermal native CUDA EXE
        if: steps.noniso.outputs.present == 'true'
        shell: pwsh
        run: |
          $cl = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $cl) { throw "MSVC cl.exe not found." }
          $ccbin = Split-Path $cl.FullName -Parent
          Write-Host "MSVC host compiler: $ccbin"
          $buildUnix = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $nvccArgs = @(
            ".noniso_build\private_noniso_native.cu",
            "src\trial_guard.cpp",
            "-std=c++17",
            "-O3",
            "--use-local-env",
            "--compiler-bindir", $ccbin,
            "--cudart", "static",
            "-Iinclude",
            "-DSOIL_LBM_BUILD_UNIX=$buildUnix",
            "-Xcompiler=/O2,/EHsc,/utf-8,/MT",
            "-gencode=arch=compute_75,code=sm_75",
            "-gencode=arch=compute_80,code=sm_80",
            "-gencode=arch=compute_86,code=sm_86",
            "-gencode=arch=compute_89,code=sm_89",
            "-gencode=arch=compute_90,code=sm_90",
            "-gencode=arch=compute_120,code=sm_120",
            "advapi32.lib",
            "crypt32.lib",
            "-o", "build\Release\SoilEvaporationLBM_NonIsothermal.exe"
          )
          & nvcc @nvccArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path build\Release\SoilEvaporationLBM_NonIsothermal.exe)) {
            throw "Non-isothermal executable was not produced."
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\SoilEvaporationLBM.exe dist\
          if (Test-Path build\Release\SoilEvaporationLBM_NonIsothermal.exe) {
            Copy-Item build\Release\SoilEvaporationLBM_NonIsothermal.exe dist\
          }
          Copy-Item config.txt dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoilEvaporationLBM-native-release-candidate
          path: dist/*
          if-no-files-found: error
