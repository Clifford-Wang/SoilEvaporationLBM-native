name: Publish non-isothermal EXE

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-noniso-exe.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions build run ID containing the native EXE'
        required: true
        default: '39036684380'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download previously built native executable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id || '39036684380' }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --name SoilEvaporationLBM-native-release-candidate --dir build-output
          test -s build-output/SoilEvaporationLBM_NonIsothermal.exe
          echo 'd8ba8d5d6e88ff3c61b3a0197a7bbeda4cef767d0061ed16bf9d2fa03a725181  build-output/SoilEvaporationLBM_NonIsothermal.exe' | sha256sum --check

      - name: Commit executable with Clifford attribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build-output/SoilEvaporationLBM_NonIsothermal.exe release/SoilEvaporationLBM_NonIsothermal.exe
          if git diff --no-index --quiet /dev/null release/SoilEvaporationLBM_NonIsothermal.exe; then
            echo 'No executable to publish'
            exit 0
          fi
          git config user.name 'Clifford'
          git config user.email '167417015+Clifford-Wang@users.noreply.github.com'
          git add release/SoilEvaporationLBM_NonIsothermal.exe
          if git diff --cached --quiet; then
            echo 'Executable already published'
            exit 0
          fi
          git commit -m 'Publish non-isothermal native CUDA executable'
          git push origin HEAD:main
